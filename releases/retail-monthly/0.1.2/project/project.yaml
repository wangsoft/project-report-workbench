schema_version: 1
project_id: retail-monthly
version: 0.1.2
status: candidate
inputs:
  data: file
  period: string
resources:
- references/brief.json
- references/experience.json
- references/experience-history.json
pipeline:
- id: analyze
  script: scripts/periodic_analysis.py
  args:
  - analyze
  - --spec
  - '{project_dir}/references/brief.json'
  - --data
  - '{input:data}'
  - --period
  - '{input:period}'
  - --out
  - '{run_dir}'
  outputs:
  - evidence.json
  cache:
    inputs:
    - data
    - period
    resources:
    - references/brief.json
    - references/experience.json
    artifacts: []
    packages:
    - openpyxl
- id: render
  script: scripts/periodic_analysis.py
  args:
  - render
  - --spec
  - '{project_dir}/references/brief.json'
  - --data
  - '{input:data}'
  - --period
  - '{input:period}'
  - --out
  - '{run_dir}'
  outputs:
  - report.md
  - report.html
  - answers.json
  - experience-applied.json
  cache:
    inputs:
    - data
    - period
    resources:
    - references/brief.json
    - references/experience.json
    artifacts:
    - evidence.json
    packages: []
- id: verify
  script: scripts/periodic_analysis.py
  args:
  - verify
  - --spec
  - '{project_dir}/references/brief.json'
  - --data
  - '{input:data}'
  - --period
  - '{input:period}'
  - --out
  - '{run_dir}'
  outputs:
  - delivery.json
  role: quality
